[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Proyecto de MLOps con datos del sistema de bicicleta p\u00fablica del \u00c1rea Metropolitana de Guadalajara. MiBici"
authors = [
  { name = "Bryan, Miguel Angel y Kevin" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

