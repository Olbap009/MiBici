name: CI - Tests and Service Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run project tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run linter and format check
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check

      - name: Run pytest suite
        run: uv run --locked pytest tests

  build-image:
    name: Build service container image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image from Containerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: mibici-p2-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health endpoint
        run: |
          docker run -d --rm --name mibici-p2-api-ci -p 127.0.0.1:8000:8000 mibici-p2-api:latest
          trap 'docker stop mibici-p2-api-ci || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              exit 0
            fi
            sleep 2
          done
          docker logs mibici-p2-api-ci
          exit 1
